name: live-paper-trade

# Runs the bot once per trading day, after the US close, and commits the updated
# portfolio + decision log back to the repo. Over weeks this builds a real
# forward-testing track record you can inspect in git history.
#
# Default: the zero-signup local paper broker on free daily data.
# To trade a real Alpaca paper account instead, add repo secrets
# ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY and switch the run step below.

on:
  schedule:
    # 22:00 UTC on weekdays — comfortably after the 16:00 ET close in both
    # EST and EDT, so the completed daily bar is available. (GitHub cron is UTC
    # and may be delayed by a few minutes.)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

# Needed so the workflow can commit the updated state back to the branch.
permissions:
  contents: write

concurrency:
  group: live-paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run one trading tick (local paper broker)
        run: |
          python -m sockmarket live \
            --broker local \
            --mode once \
            --strategy momentum \
            --symbols AAPL MSFT GOOG AMZN NVDA \
            --cash 100000 \
            --state data/live_state.json \
            --ignore-hours
        # --ignore-hours: this is an end-of-day bot. It acts on the latest
        # completed daily bar; the market being closed at run time is expected.

        # --- Alpaca alternative (real paper account) -----------------------
        # Replace the run block above with:
        #   env:
        #     ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
        #     ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        #   run: |
        #     python -m sockmarket live --broker alpaca --mode once \
        #       --strategy momentum --symbols AAPL MSFT GOOG AMZN NVDA --ignore-hours

      - name: Regenerate the dashboard
        run: |
          python -m sockmarket dashboard \
            --state data/live_state.json \
            --out dashboard.html

      - name: Commit the updated track record
        run: |
          git config user.name "sockmarket-bot"
          git config user.email "actions@github.com"
          git add data/live_state.json data/live_decisions.log dashboard.html
          if git diff --cached --quiet; then
            echo "No state changes to commit (no new bar today)."
          else
            git commit -m "chore(live): daily trading tick $(date -u +%Y-%m-%d)"
            git push
          fi
