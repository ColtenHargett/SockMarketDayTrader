name: live-paper-trade

# Runs the bot once per trading day, after the US close, and commits the updated
# portfolio + decision log back to the repo. Over weeks this builds a real
# forward-testing track record you can inspect in git history.
#
# Data source is chosen automatically:
#   - If repo secrets ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY are set, it
#     trades a real Alpaca *paper* account (reliable data + fills from CI).
#   - Otherwise it uses the free local paper broker. Note: free data hosts
#     (Yahoo/Stooq) rate-limit GitHub's shared runner IPs, so free-mode runs can
#     intermittently fetch no data and simply hold — add Alpaca keys for
#     reliable daily data.

on:
  schedule:
    # 22:00 UTC on weekdays — comfortably after the 16:00 ET close in both
    # EST and EDT, so the completed daily bar is available. (GitHub cron is UTC
    # and may be delayed by a few minutes.)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

# Needed so the workflow can commit the updated state back to the branch.
permissions:
  contents: write

concurrency:
  group: live-paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run one trading tick
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          # Use Alpaca automatically when keys are present; otherwise free data.
          if [ -n "$ALPACA_API_KEY_ID" ] && [ -n "$ALPACA_API_SECRET_KEY" ]; then
            BROKER=alpaca
          else
            BROKER=local
          fi
          echo "Trading via broker: $BROKER"
          # --ignore-hours: this is an end-of-day bot — it acts on the latest
          # completed daily bar, so the market being closed at run time is fine.
          python -m sockmarket live \
            --broker "$BROKER" \
            --mode once \
            --strategy momentum \
            --symbols AAPL MSFT GOOG AMZN NVDA \
            --cash 100000 \
            --state data/live_state.json \
            --ignore-hours

      - name: Regenerate the dashboard
        if: always()  # refresh the dashboard even if a tick fetched no data
        run: |
          python -m sockmarket dashboard \
            --state data/live_state.json \
            --out dashboard.html

      - name: Commit the updated track record
        if: always()
        run: |
          git config user.name "sockmarket-bot"
          git config user.email "actions@github.com"
          # Stage whatever exists; a no-data day may produce no state file.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit (no new bar today)."
          else
            git commit -m "chore(live): daily trading tick $(date -u +%Y-%m-%d)"
            git push
          fi
